name: collect availability

on:
  # Daily trigger at 14:00 IST (08:30 UTC). It only does work on the dates listed
  # in the repository variable RUN_DATES, so it costs nothing on other days.
  schedule:
    - cron: "30 8 * * *"
  # Manual trigger: shows a form with these boxes
  workflow_dispatch:
    inputs:
      groups:
        description: "Corridor groups. A = Shatabdi/Jan Shatabdi, B = Vande Bharat, C = new candidates"
        default: "A,B,C"
      leads:
        description: "Days ahead to sample, comma separated"
        default: "1"
      max_rows:
        description: "Stop after this many billed rows (1000 rows = about $1)"
        default: "2500"
      probe:
        description: "1 = also test the shorter leg when a pair is waitlisted"
        default: "0"
      tag:
        description: "Short label for this run, used in the folder name"
        default: "trial"

permissions:
  contents: read

concurrency:
  group: collect-availability
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Collect
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TRIGGER: ${{ github.event_name }}
          RUN_DATES: ${{ vars.RUN_DATES }}
          CORRIDOR_GROUPS: ${{ github.event.inputs.groups || vars.CORRIDOR_GROUPS || 'A,B,C' }}
          LEADS: ${{ github.event.inputs.leads || vars.LEADS || '1,7,30' }}
          MAX_ROWS: ${{ github.event.inputs.max_rows || vars.MAX_ROWS || '5500' }}
          PROBE: ${{ github.event.inputs.probe || vars.PROBE || '0' }}
          RUN_TAG: ${{ github.event.inputs.tag || 'scheduled' }}
        run: python collect_availability.py

      - name: Save to private data repo
        if: always()
        env:
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          RUN_TAG: ${{ github.event.inputs.tag || 'scheduled' }}
        run: |
          set -e
          if ! ls out/*.csv >/dev/null 2>&1; then
            echo "No output files (run day skipped or run failed early). Nothing to save."
            exit 0
          fi
          DAY=$(TZ=Asia/Kolkata date +%F)
          TIME=$(TZ=Asia/Kolkata date +%H%M)
          TAG=$(printf '%s' "$RUN_TAG" | tr -c 'A-Za-z0-9_-' '_')
          git clone "https://x-access-token:${DATA_REPO_TOKEN}@github.com/${OWNER}/rail-data-private.git" data_repo
          DEST="data_repo/data/${DAY}/${TIME}_${TAG}"
          mkdir -p "$DEST"
          cp out/*.csv out/*.json "$DEST"/ || true
          cp corridors.csv "$DEST"/corridors_used.csv
          cd data_repo
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add -A
          git commit -m "data ${DAY} ${TIME} ${TAG}" || echo "nothing to commit"
          git push
